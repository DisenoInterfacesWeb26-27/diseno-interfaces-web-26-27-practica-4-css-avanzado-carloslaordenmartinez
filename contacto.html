    <main>
        <section>
            <h2>Escríbenos</h2>
            <form>
                <fieldset>
                    <legend>Formulario de contacto</legend>
                    <label for="nombre">Nombre: </label>
                    <input id="nombre" name="nombre" type="text" required autofocus placeholder="Introduzca su nombre"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9]+" maxlength="40" title="Solo se permiten letras y números">
                    <label for="email">Email: </label>
                    <input id="email" name="email" type="email" required placeholder="Introduzca su email">
                    <label for="edad">Edad: </label>
                    <input type="number" name="edad" id="edad" min="18" max="99" required placeholder="Introduzca su edad">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" name="telefono" id="telefono" required placeholder="Introduzca su teléfono">
                    <label for="mensaje">Escribe tu consulta: </label>
                    <textarea name="mensaje" rows="10" cols="50" required placeholder="Introduzca su mensaje" id="mensaje"></textarea>
                    <label for="aceptar">Acepto la política de privacidad y cookies: </label>
                    <input type="checkbox" name="aceptar" id="aceptar" required>
                </fieldset>
                <input type="submit" value="Enviar">
            </form>
        </section>
        <section>
            <h2>Información de contacto</h2>
            <h3>Clínica DIW</h3>
            <p>Calle Alicante, 99, 03000 Alicante, España</p>
            <p><a href="tel:966000000">Teléfono: 966 00 00 00</a></p>
            <p><a href="mailto:info@diw.com">Email: info@diw.com</a></p>
        </section>
